<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battery Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Batteries</h1>
    <span id="updated" class="muted"></span>
    <button id="search" type="button">Search</button>
    <button id="refresh-all" type="button">Refresh all</button>
    <button id="settings" type="button">Settings</button>
  </header>
  <main>
    <div id="overview"><p class="muted">Loading…</p></div>
    <section id="discovered" hidden></section>
  </main>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div id="modal-buttons" class="buttons"></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="detail">
    <form method="dialog" class="detail-head">
      <h2 id="detail-title"></h2>
      <button id="detail-refresh" type="button">Refresh now</button>
      <button value="close" aria-label="Close">✕</button>
    </form>
    <div id="detail-body"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
